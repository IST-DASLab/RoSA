[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosa"
version = "0.2.0"
description = "RoSA: Robust Adaptation for parameter-efficient fine-tuning with HuggingFace"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "IST-DASLab" },
]
dependencies = [
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "datasets>=3.0",
    "evaluate>=0.4",
    "lm-eval>=0.4",
    "peft",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.9",
    "spops",
    "torch>=2.10",
    "tqdm>=4.66",
    "transformers>=5.5",
    "trl>=0.11",
]

[project.scripts]
rosa-train = "rosa.cli:main_train"
rosa-eval = "rosa.cli:main_eval"

[tool.hatch.build.targets.wheel]
packages = ["src/rosa"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
peft = { path = "third_party/peft-rosa", editable = true }
spops = { path = "third_party/spops" }

[tool.uv]
no-build-isolation-package = ["spops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
